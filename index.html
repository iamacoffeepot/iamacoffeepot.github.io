<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games · iamacoffeepot</title>
  <meta name="description" content="Small games that run in the browser.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="site">
    <header>
      <a class="name" href="/">iamacoffeepot</a>
      <nav><a href="/" aria-current="page">Games</a></nav>
    </header>
    <main>
      <h1>Games</h1>
      <ul class="games">
        <li>
          <a class="game" href="/games/pong/">
            <svg viewBox="0 0 160 90" role="img" aria-label="Pong: two paddles and a ball">
              <line x1="80" y1="6" x2="80" y2="84" stroke="#3a3d48" stroke-width="2" stroke-dasharray="5 5"/>
              <rect x="10" y="30" width="4" height="22" fill="#f2f2f2"/>
              <rect x="146" y="44" width="4" height="22" fill="#f2f2f2"/>
              <rect x="104" y="38" width="5" height="5" fill="#f2f2f2"/>
              <text x="62" y="20" fill="#f2f2f2" font-family="monospace" font-size="12" text-anchor="middle">3</text>
              <text x="98" y="20" fill="#f2f2f2" font-family="monospace" font-size="12" text-anchor="middle">2</text>
            </svg>
            <h2>Pong</h2>
            <p>You against the machine. The ball gets faster every hit. First to 11.</p>
          </a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
