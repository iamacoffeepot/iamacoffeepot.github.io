<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demos · iamacoffeepot</title>
  <meta name="description" content="Rendering demos that run in the browser.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="site">
    <header>
      <a class="name" href="/">iamacoffeepot</a>
      <nav><a href="/">Games</a><a href="/demos/" aria-current="page">Demos</a></nav>
    </header>
    <main>
      <h1>Demos</h1>
      <ul class="games">
        <li>
          <a class="game" href="/demos/galaxy/">
            <svg viewBox="0 0 160 90" role="img" aria-label="A spiral galaxy">
              <defs>
                <radialGradient id="core" cx="50%" cy="50%" r="50%">
                  <stop offset="0" stop-color="#fff4dc"/>
                  <stop offset="0.45" stop-color="#e9c98f" stop-opacity="0.7"/>
                  <stop offset="1" stop-color="#e9c98f" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <g transform="translate(80 45) rotate(-18) scale(1 0.62)" fill="none" stroke-linecap="round">
                <path d="M0 0 C 12 -10, 30 -6, 34 8 C 38 22, 20 36, -2 36 C -30 36, -52 18, -54 -6" stroke="#8fa8dc" stroke-opacity="0.55" stroke-width="5"/>
                <path d="M0 0 C -12 10, -30 6, -34 -8 C -38 -22, -20 -36, 2 -36 C 30 -36, 52 -18, 54 6" stroke="#8fa8dc" stroke-opacity="0.55" stroke-width="5"/>
                <circle r="16" fill="url(#core)"/>
              </g>
            </svg>
            <h2>Galaxy</h2>
            <p>65,536 stars simulated on the GPU, with bloom. Drag to pull them.</p>
          </a>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
