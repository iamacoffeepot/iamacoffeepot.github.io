<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong · iamacoffeepot</title>
  <meta name="description" content="Pong against an AI opponent. The ball gets faster every hit. First to 11.">
  <link rel="stylesheet" href="/style.css">
  <style>
    .play canvas { width: min(100%, calc((100vh - 240px) * 4 / 3)); min-width: 280px; }
    body.unable .play canvas, body.unable .hint { display: none; }
    #said { display: none; }
    body.unable #said { display: block; }
    #said strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="site">
    <header>
      <a class="name" href="/">iamacoffeepot</a>
      <nav><a href="/" aria-current="page">Games</a><a href="/demos/">Demos</a></nav>
    </header>
    <main class="play">
      <canvas id="canvas" tabindex="0" aria-label="Pong"></canvas>
      <p class="hint">↑ / ↓ to move · hit while moving to curve · first to 11</p>
      <p class="hint"><a href="https://github.com/iamacoffeepot/aethereal/tree/8774263308284ddc614f4e9d73c1020924e08a6c/crates/aethereal-chassis-browser/examples/pong">View the code on GitHub</a></p>
      <div id="said" class="notice"></div>
    </main>
  </div>
  <script type="module">
    import init, { start } from "./pkg/pong.js";

    // Arrow keys and space play the game rather than scroll the page.
    const gameKeys = new Set(["ArrowUp", "ArrowDown", " ", "Spacebar"]);
    window.addEventListener("keydown", (event) => {
      if (gameKeys.has(event.key)) event.preventDefault();
    }, { passive: false });

    const said = document.getElementById("said");
    const unable = (headline, detail) => {
      said.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = headline;
      said.append(strong, detail);
      document.body.classList.add("unable");
    };

    if (!navigator.gpu) {
      unable("WebGPU is not available", "This game draws with WebGPU, which this browser does not offer. Try a recent Chrome or Edge, or Firefox or Safari with WebGPU turned on.");
    } else {
      const canvas = document.getElementById("canvas");
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * scale);
      canvas.height = Math.floor(canvas.clientHeight * scale);
      canvas.focus();

      try {
        await init();
        const program = await start(canvas);
        const frame = () => {
          program.frame();
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      } catch (error) {
        unable("The game could not start", `${error}`);
        throw error;
      }
    }
  </script>
</body>
</html>
